<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Items | BorrowBuddy</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8fafc;
            color: #172033;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
            text-decoration: none;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #475569;
            font-size: 14px;
        }

        .login {
            border: 1px solid #2563eb;
            padding: 9px 16px;
            border-radius: 8px;
            color: #2563eb;
        }

        .signup {
            background: #2563eb;
            color: white !important;
            padding: 10px 16px;
            border-radius: 8px;
        }

        #authLoggedIn {
            display: none;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            border: 1px solid #cbd5e1;
            padding: 9px 16px;
            border-radius: 8px;
            color: #475569;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-family: Arial, sans-serif;
        }

        .page-header {
            text-align: center;
            padding: 50px 7% 20px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .page-header p {
            color: #64748b;
        }

        .page-header .cta {
            display: inline-block;
            margin-top: 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .section-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .section-wrap h2 {
            font-size: 20px;
            margin-bottom: 16px;
        }

        .request-card, .item-row {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 14px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .photo {
            width: 60px;
            height: 60px;
            background: #e2e8f0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .info {
            flex: 1;
        }

        .info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .info p {
            color: #64748b;
            font-size: 13px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            border: none;
            padding: 8px 14px;
            border-radius: 7px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .accept-btn {
            background: #2563eb;
            color: white;
        }

        .reject-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        .delete-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: capitalize;
        }

        .badge-available {
            background: #dcfce7;
            color: #166534;
        }

        .badge-unavailable {
            background: #fef9c3;
            color: #854d0e;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
            background: white;
            border: 1px dashed #dbe2ea;
            border-radius: 14px;
        }

        footer {
            background: #172033;
            color: white;
            text-align: center;
            padding: 40px 7%;
            margin-top: 40px;
        }

        footer p {
            color: #94a3b8;
            margin-top: 10px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            nav a:not(.login):not(.signup) {
                display: none;
            }

            .request-card, .item-row {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">BorrowBuddy</a>

    <nav>
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="index.html#how-it-works">How It Works</a>

        <span id="authLoggedOut" style="display:flex; align-items:center; gap:25px;">
            <a href="login.html" class="login">Login</a>
            <a href="signup.html" class="signup">Sign Up</a>
        </span>

        <span id="authLoggedIn">
            <a href="my-items.html">My Items</a>
            <a href="my-requests.html">My Requests</a>
            <button class="logout-btn" onclick="bbLogout()">Logout</button>
        </span>
    </nav>
</header>

<section class="page-header">
    <h1>My Items</h1>
    <p>Manage the items you've listed and respond to borrow requests.</p>
    <a href="list-item.html" class="cta">+ List a New Item</a>
</section>

<div class="section-wrap">
    <h2>Incoming Requests</h2>
    <div id="incomingWrap"></div>
</div>

<div class="section-wrap">
    <h2>Your Listings</h2>
    <div id="listingsWrap"></div>
</div>

<footer>
    <h2>BorrowBuddy</h2>
    <p>Borrow what you need. Share what you don't.</p>
    <p>© 2026 BorrowBuddy. All rights reserved.</p>
</footer>

<script src="auth.js"></script>
<script src="items-data.js"></script>
<script src="requests.js"></script>
<script>
    const user = bbRequireAuth();

    function renderIncoming() {
        const wrap = document.getElementById("incomingWrap");
        const incoming = bbGetIncomingRequests(user.id).filter(r => r.status === "pending");

        if (incoming.length === 0) {
            wrap.innerHTML = `<div class="empty-state">No pending requests right now.</div>`;
            return;
        }

        wrap.innerHTML = "";

        incoming.forEach(req => {
            const item = bbGetItemById(req.itemId);
            const users = bbGetUsers();
            const borrower = users.find(u => u.id === req.borrowerId);
            const borrowerName = borrower ? borrower.name : "A user";

            const card = document.createElement("div");
            card.className = "request-card";
            card.innerHTML = `
                <div class="photo">${item.photo}</div>
                <div class="info">
                    <h3>${item.name}</h3>
                    <p>Requested by ${borrowerName}</p>
                </div>
                <div class="actions">
                    <button class="action-btn accept-btn" onclick="respond('${req.id}', 'accepted')">Accept</button>
                    <button class="action-btn reject-btn" onclick="respond('${req.id}', 'rejected')">Reject</button>
                </div>
            `;
            wrap.appendChild(card);
        });
    }

    function renderListings() {
        const wrap = document.getElementById("listingsWrap");
        const items = bbGetItemsByOwner(user.id);

        if (items.length === 0) {
            wrap.innerHTML = `<div class="empty-state">You haven't listed anything yet. <a href="list-item.html">List your first item →</a></div>`;
            return;
        }

        wrap.innerHTML = "";

        items.forEach(item => {
            const row = document.createElement("div");
            row.className = "item-row";
            row.innerHTML = `
                <div class="photo">${item.photo}</div>
                <div class="info">
                    <h3>${item.name}</h3>
                    <p>${item.category} · ${item.price}</p>
                </div>
                <span class="badge ${item.availability ? 'badge-available' : 'badge-unavailable'}">
                    ${item.availability ? 'Available' : 'Borrowed'}
                </span>
                <div class="actions">
                    <button class="action-btn delete-btn" onclick="removeItem('${item.id}')">Delete</button>
                </div>
            `;
            wrap.appendChild(row);
        });
    }

    function respond(requestId, status) {
        bbUpdateRequestStatus(requestId, status);
        renderIncoming();
        renderListings();
    }

    function removeItem(itemId) {
        if (confirm("Delete this listing? This can't be undone.")) {
            bbDeleteItem(itemId);
            renderListings();
        }
    }

    renderIncoming();
    renderListings();
</script>

</body>
</html>
