<nav>

</header><section class="page-header"><h1>My Requests</h1>

<p>

</p>

</section><div class="tabs"><button class="tab-btn active" data-filter="all">

</button>

<button class="tab-btn" data-filter="pending">
    Pending
</button>

<button class="tab-btn" data-filter="approved">

</button>

<button class="tab-btn" data-filter="returned">

</button>

<button class="tab-btn" data-filter="rejected">
    Rejected
</button>

</div><div class="list-wrap" id="listWrap"><div class="empty-state">

    <h3>
        Loading requests...
    </h3>

    <p>
        Please wait.
    </p>

</div>

</div><footer><h2>BorrowBuddy</h2>

<p>

<p>

</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>

"use strict";


let currentUser = null;
let currentFilter = "all";
let allRequests = [];

const listWrap =
    document.getElementById("listWrap");


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ==================================================
   GET CURRENT USER
================================================== */

async function getCurrentUser() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getUser();

        if (error) {

            console.error(
                "User error:",
                error
            );

            return null;
        }

        return data.user || null;

    } catch (error) {

        console.error(
            "Current user error:",
            error
        );

        return null;
    }
}


/* ==================================================
   LOAD REQUESTS
================================================== */

async function loadRequests() {

    listWrap.innerHTML = `

        <div class="empty-state">

            <h3>
                Loading requests...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    `;


    currentUser =
        await getCurrentUser();


    if (!currentUser) {

        listWrap.innerHTML = `

            <div class="login-state">

                <h3>
                    Please log in
                </h3>

                <p>
                    You need to log in
                    to see your borrow requests.
                </p>

                <a
                    href="login.html"
                    class="login-btn"
                >
                    Login
                </a>

            </div>

        `;

        return;
    }


    const {
        data: requests,
        error
    } =
        await supabaseClient

            .from("borrow_requests")

            .select(`

                id,
                item_id,
                borrower_id,
                owner_id,
                message,
                status,
                requested_at,
                approved_at,
                returned_at,

                items (
                    id,
                    title,
                    icon,
                    price_type,
                    price_amount,
                    location
                ),

                profiles:owner_id (
                    id,
                    full_name
                )

            `)

            .eq(
                "borrower_id",
                currentUser.id
            )

            .order(
                "requested_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Requests loading error:",
            error
        );

        listWrap.innerHTML = `

            <div class="error-state">

                <h3>
                    Could not load requests
                </h3>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

            </div>

        `;

        return;
    }


    allRequests =
        requests || [];


    renderRequests();

}


/* ==================================================
   RENDER REQUESTS
================================================== */

function renderRequests() {

    let filteredRequests =
        allRequests;


    if (
        currentFilter !== "all"
    ) {

        filteredRequests =
            allRequests.filter(
                request =>
                    request.status ===
                    currentFilter
            );

    }


    if (
        filteredRequests.length === 0
    ) {

        let message =
            "Browse items and send a request to get started.";


        if (
            currentFilter !== "all"
        ) {

            const filterNames = {

                pending:
                    "pending",

                approved:
                    "currently borrowed",

                returned:
                    "returned",

                rejected:
                    "rejected"

            };


            message =
                "You don't have any " +
                (
                    filterNames[
                        currentFilter
                    ] ||
                    currentFilter
                ) +
                " requests.";

        }


        listWrap.innerHTML = `

            <div class="empty-state">

                <h3>
                    No requests here
                </h3>

                <p>
                    ${escapeHtml(message)}
                </p>

                <br>

                <a href="browse.html">
                    Browse Items →
                </a>

            </div>

        `;

        return;
    }


    listWrap.innerHTML = "";


    filteredRequests.forEach(
        request => {

            const item =
                request.items;

            const owner =
                request.profiles;


            if (!item) {
                return;
            }


            /* PRICE */

            let priceText =
                "Free to borrow";


            if (
                item.price_type ===
                    "paid" &&
                item.price_amount !==
                    null
            ) {

                priceText =
                    "₹" +
                    Number(
                        item.price_amount
                    ).toLocaleString(
                        "en-IN"
                    ) +
                    " / day";

            }


            /* OWNER */

            const ownerName =
                owner &&
                owner.full_name
                    ? owner.full_name
                    : "BorrowBuddy User";


            /* STATUS */

            let statusText =
                request.status;


            if (
                request.status ===
                "approved"
            ) {

                statusText =
                    "Currently Borrowed";

            }


            if (
                request.status ===
                "returned"
            ) {

                statusText =
                    "Returned";

            }


            if (
                request.status ===
                "pending"
            ) {

                statusText =
                    "Pending";

            }


            if (
                request.status ===
                "rejected"
            ) {

                statusText =
                    "Rejected";

            }


            /* ACTIONS */

            let actionsHtml = "";


            /*
             Private chat is available
             for approved or pending
             requests.
            */

            if (
                request.status ===
                    "pending" ||
                request.status ===
                    "approved"
            ) {

                actionsHtml += `

                    <button
                        type="button"
                        class="action-btn chat-btn"
                        onclick="openPrivateChat(
                            '${escapeHtml(request.item_id)}',
                            '${escapeHtml(request.owner_id)}',
                            '${escapeHtml(request.borrower_id)}'
                        )"
                    >
                        💬 Private Chat
                    </button>

                `;

            }


            /*
             Return button.
            */

            if (
                request.status ===
                "approved"
            ) {

                actionsHtml += `

                    <button
                        type="button"
                        class="action-btn return-btn"
                        onclick="markReturned(
                            '${escapeHtml(request.id)}',
                            '${escapeHtml(request.item_id)}'
                        )"
                    >
                        Mark as Returned
                    </button>

                `;

            }


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "request-card";


            card.innerHTML = `

                <div class="request-photo">

                    ${escapeHtml(
                        item.icon ||
                        "📦"
                    )}

                </div>


                <div class="request-info">

                    <h3>

                        ${escapeHtml(
                            item.title ||
                            "Untitled Item"
                        )}

                    </h3>


                    <p>

                        Owner:
                        <strong>
                            ${escapeHtml(
                                ownerName
                            )}
                        </strong>

                        ·

                        ${escapeHtml(
                            priceText
                        )}

                    </p>


                    ${
                        item.location
                        ? `

                            <p>
                                📍
                                ${escapeHtml(
                                    item.location
                                )}
                            </p>

                        `
                        : ""
                    }


                    ${
                        request.message
                        ? `

                            <p
                                class="request-message"
                            >

                                <strong>
                                    Your message:
                                </strong>

                                ${escapeHtml(
                                    request.message
                                )}

                            </p>

                        `
                        : ""
                    }

                </div>


                <div
                    class="request-actions"
                >

                    <span
                        class="
                            status-pill
                            status-${escapeHtml(
                                request.status
                            )}
                        "
                    >

                        ${escapeHtml(
                            statusText
                        )}

                    </span>


                    ${actionsHtml}

                </div>

            `;


            listWrap.appendChild(
                card
            );

        }
    );

}


/* ==================================================
   OPEN PRIVATE CHAT
================================================== */

async function openPrivateChat(
    itemId,
    ownerId,
    borrowerId
) {

    if (!currentUser) {

        alert(
            "Please log in first."
        );

        return;
    }


    /*
     The logged-in borrower
     must match borrowerId.
    */

    if (
        currentUser.id !==
        borrowerId
    ) {

        alert(
            "You are not allowed to open this conversation."
        );

        return;
    }


    try {

        /*
         Check existing conversation.
        */

        const {
            data: existingConversation,
            error: findError
        } =
            await supabaseClient

                .from("conversations")

                .select(`
                    id,
                    item_id,
                    borrower_id,
                    owner_id
                `)

                .eq(
                    "item_id",
                    itemId
                )

                .eq(
                    "borrower_id",
                    borrowerId
                )

                .eq(
                    "owner_id",
                    ownerId
                )

                .maybeSingle();


        if (findError) {

            console.error(
                "Conversation lookup error:",
                findError
            );

            alert(
                "Could not open private chat.\n\n" +
                findError.message
            );

            return;
        }


        let conversationId = null;


        if (
            existingConversation
        ) {

            conversationId =
                existingConversation.id;

        } else {

            /*
             Create conversation.
            */

            const {
                data: newConversation,
                error: createError
            } =
                await supabaseClient

                    .from("conversations")

                    .insert({

                        item_id:
                            itemId,

                        borrower_id:
                            borrowerId,

                        owner_id:
                            ownerId

                    })

                    .select(`
                        id,
                        item_id,
                        borrower_id,
                        owner_id
                    `)

                    .single();


            if (createError) {

                console.error(
                    "Conversation creation error:",
                    createError
                );

                alert(
                    "Could not create private chat.\n\n" +
                    createError.message
                );

                return;
            }


            conversationId =
                newConversation.id;

        }


        window.location.href =
            "chat.html?conversation_id=" +
            encodeURIComponent(
                conversationId
            );

    } catch (error) {

        console.error(
            "Private chat error:",
            error
        );

        alert(
            "Something went wrong while opening the private chat."
        );

    }

}


/* ==================================================
   MARK AS RETURNED
================================================== */

async function markReturned(
    requestId,
    itemId
) {

    if (!currentUser) {

        alert(
            "Please log in first."
        );

        return;
    }


    const confirmed =
        confirm(
            "Have you returned this item to the owner?"
        );


    if (!confirmed) {
        return;
    }


    /*
     STEP 1:
     Mark request as returned.
    */

    const {
        error: requestError
    } =
        await supabaseClient

            .from("borrow_requests")

            .update({

                status:
                    "returned",

                returned_at:
                    new Date()
                        .toISOString()

            })

            .eq(
                "id",
                requestId
            )

            .eq(
                "borrower_id",
                currentUser.id
            );


    if (requestError) {

        console.error(
            "Return request error:",
            requestError
        );

        alert(
            "Could not mark the request as returned.\n\n" +
            requestError.message
        );

        return;
    }


    /*
     STEP 2:
     Make item available again.

     IMPORTANT:
     availability is TEXT.
    */

    const {
        data: updatedItem,
        error: itemError
    } =
        await supabaseClient

            .from("items")

            .update({

                availability:
                    "available",

                updated_at:
                    new Date()
                        .toISOString()

            })

            .eq(
                "id",
                itemId
            )

            .select(
                "id, availability"
            )
            .maybeSingle();


    if (itemError) {

        console.error(
            "Item availability error:",
            itemError
        );

        alert(
            "The request was marked as returned, " +
            "but the item could not be made available again.\n\n" +
            itemError.message
        );

        await loadRequests();

        return;
    }


    if (
        !updatedItem ||
        updatedItem.availability !==
            "available"
    ) {

        console.error(
            "Item was not updated:",
            updatedItem
        );

        alert(
            "The request was returned, but the item could not be updated.\n\n" +
            "Please check your Supabase RLS policies."
        );

        await loadRequests();

        return;
    }


    alert(
        "Item returned successfully!\n\n" +
        "The item is now available for other users."
    );


    await loadRequests();

}


/* ==================================================
   FILTER BUTTONS
================================================== */

document
    .querySelectorAll(".tab-btn")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".tab-btn"
                        )
                        .forEach(
                            btn => {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    currentFilter =
                        button.dataset.filter;


                    renderRequests();

                }
            );

        }
    );


/* ==================================================
   START
================================================== */

loadRequests();

</script></body>
